name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-unit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'core/**', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install base dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates ccache \
            libomp-dev libopenmpi-dev openmpi-bin \
            libssl-dev libboost-dev libunwind-dev libgoogle-glog-dev pybind11-dev libgtest-dev \
            libcurl4-openssl-dev zlib1g-dev libzstd-dev liblz4-dev libsnappy-dev libbrotli-dev \
            libthrift-dev

      - name: Install Apache Arrow dev packages
        run: |
          set -euxo pipefail
          sudo apt-get install -y lsb-release wget gnupg
          CODENAME=$(lsb_release --codename --short)
          DEB_URL="https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${CODENAME}.deb"
          ALT_URL="https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-noble.deb"
          TMP_DEB=/tmp/apache-arrow-apt-source.deb
          if ! wget -q -O "$TMP_DEB" "$DEB_URL"; then wget -q -O "$TMP_DEB" "$ALT_URL"; fi
          sudo apt-get install -y "$TMP_DEB"
          sudo apt-get update -y
          sudo apt-get install -y libarrow-dev libparquet-dev libarrow-compute-dev libarrow-dataset-dev

      - name: Configure
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 2G
        run: cmake -S . -B build -GNinja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build unit tests
        env:
          CCACHE_DIR: ~/.ccache
        run: ninja -C build SurfingDbTests

      - name: Run unit tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: ctest --test-dir build -R SurfingDbTests -j2

  mpi-nested:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        np: [2, 4]
        mode: [one, two]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'core/**', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build + MPI deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl ca-certificates ccache \
            libomp-dev libopenmpi-dev openmpi-bin \
            libssl-dev libboost-dev libunwind-dev libgoogle-glog-dev pybind11-dev libgtest-dev \
            libcurl4-openssl-dev zlib1g-dev libzstd-dev liblz4-dev libsnappy-dev libbrotli-dev \
            libthrift-dev

      - name: Install Apache Arrow dev packages
        run: |
          set -euxo pipefail
          sudo apt-get install -y lsb-release wget gnupg
          CODENAME=$(lsb_release --codename --short)
          DEB_URL="https://apache.jfrog.io/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${CODENAME}.deb"
          ALT_URL="https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-noble.deb"
          TMP_DEB=/tmp/apache-arrow-apt-source.deb
          if ! wget -q -O "$TMP_DEB" "$DEB_URL"; then wget -q -O "$TMP_DEB" "$ALT_URL"; fi
          sudo apt-get install -y "$TMP_DEB"
          sudo apt-get update -y
          sudo apt-get install -y libarrow-dev libparquet-dev libarrow-compute-dev libarrow-dataset-dev

      - name: Configure (MPI tests enabled)
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 2G
        run: cmake -S . -B build -GNinja -DENABLE_MPI_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build nested MPI tests
        env:
          CCACHE_DIR: ~/.ccache
        run: ninja -C build MpiNestedShuffleTest MpiNestedCoGroupTest

      - name: Run nested MPI tests (${{ matrix.mode }}, np=${{ matrix.np }})
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          ctest --test-dir build -R "MpiNested(Shuffle|CoGroup)_${{ matrix.mode }}_np${{ matrix.np }}" -V
