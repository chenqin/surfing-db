name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-test-quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Arrow build/install
        uses: actions/cache@v4
        with:
          path: |
            ~/apache-arrow-12.0.0
            ~/arrow-12-install
          key: arrow-12-${{ runner.os }}-v1
          restore-keys: |
            arrow-12-${{ runner.os }}-

      - name: Build and install (no MPI tests)
        run: |
          chmod +x scripts/build_install.sh
          ./scripts/build_install.sh

      - name: Run tests
        env:
          CTEST_OUTPUT_ON_FAILURE: '1'
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh --no-mpi

  mpi-tests:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Arrow build/install
        uses: actions/cache@v4
        with:
          path: |
            ~/apache-arrow-12.0.0
            ~/arrow-12-install
          key: arrow-12-${{ runner.os }}-v1
          restore-keys: |
            arrow-12-${{ runner.os }}-

      - name: Build and install (MPI tests enabled)
        env:
          CMAKE_EXTRA_FLAGS: -DENABLE_MPI_TESTS=ON
        run: |
          chmod +x scripts/build_install.sh
          ./scripts/build_install.sh

      - name: Run tests (including MPI)
        env:
          CTEST_OUTPUT_ON_FAILURE: '1'
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh
